[tool.poetry]
name = "storyteller-backend"
version = "0.1.0"
description = "Storyteller interactive narrative backend"
authors = []
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "0.115.5"
uvicorn = {version = "0.34.0", extras = ["standard"]}
sse-starlette = "2.2.1"
python-multipart = "0.0.20"
pydantic = "2.10.3"
pydantic-settings = "2.6.1"
python-dotenv = "1.0.1"
langchain = "0.3.13"
langchain-openai = "0.2.14"
langchain-core = "0.3.28"
langgraph = "0.2.59"
openai = "1.58.1"
chromadb = "1.3.7"
rank-bm25 = "0.2.2"
networkx = "3.4.2"
onnxruntime = ">=1.23.0,<1.24"  # pin: 1.24+ lacks macOS arm64 wheels

[tool.poetry.group.dev.dependencies]
pytest = "8.3.4"
pytest-asyncio = "0.24.0"
pytest-cov = "6.0.0"
httpx = "0.28.1"
black = "24.10.0"
ruff = "0.8.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
